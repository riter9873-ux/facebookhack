<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Premium Dual Capture</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a001a;
      --card: rgba(20, 20, 40, 0.75);
      --text: #e0e0ff;
      --accent: #00eaff;
      --glow: 0 0 25px rgba(0, 234, 255, 0.7);
      --border: rgba(0, 234, 255, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a001f, #1a0033, #0f0f1a);
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4.5rem;
      background: linear-gradient(90deg, #00eaff, #a78bfa, #ff71ce);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: var(--glow);
      letter-spacing: 4px;
      margin-bottom: 0.8rem;
    }

    .subtitle {
      font-size: 1.4rem;
      max-width: 800px;
      text-align: center;
      margin-bottom: 4rem;
      color: #b0b0ff;
      opacity: 0.9;
      line-height: 1.7;
    }

    .premium-card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 4rem 5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7), var(--glow);
      width: 90%;
      max-width: 700px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .premium-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(0,234,255,0.15), transparent 60%);
      pointer-events: none;
    }

    button {
      padding: 20px 70px;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-radius: 60px;
      color: white;
      background: linear-gradient(135deg, #00eaff, #7c3aed, #ff71ce);
      box-shadow: 0 15px 40px rgba(0, 234, 255, 0.5);
      transition: all 0.45s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    button:hover {
      transform: translateY(-8px) scale(1.06);
      box-shadow: 0 30px 70px rgba(0, 234, 255, 0.8);
    }

    button:disabled {
      opacity: 0.4;
      transform: none;
      box-shadow: none;
      cursor: not-allowed;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0; left: -120%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.8s;
      z-index: -1;
    }

    button:hover::before {
      left: 120%;
    }

    #status {
      margin-top: 3rem;
      font-size: 1.4rem;
      color: #a0a0ff;
      text-shadow: 0 0 12px rgba(160,160,255,0.6);
      min-height: 50px;
    }

    .glow {
      text-shadow: 0 0 20px rgba(0,234,255,0.8);
    }
  </style>
</head>
<body>

  <h1 class="glow">Dual Camera Capture</h1>
  <p class="subtitle">One click → Front & Back photos instantly sent to Telegram</p>

  <div class="premium-card">
    <button id="captureBtn" onclick="captureBothCameras()">
      Capture & Send Both Cameras
    </button>

    <div id="status"></div>
  </div>

  <script>
    const btn = document.getElementById('captureBtn');
    const status = document.getElementById('status');

    async function captureBothCameras() {
      btn.disabled = true;
      btn.textContent = "Capturing...";
      status.textContent = "";

      try {
        // Front camera
        status.textContent = "Front camera capturing...";
        const frontStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }
        });
        const frontBase64 = await quickCapture(frontStream);
        await sendPhoto(frontBase64, "front");

        // Back camera
        status.textContent = "Back camera capturing...";
        const backStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        const backBase64 = await quickCapture(backStream);
        await sendPhoto(backBase64, "back");

        status.textContent = "Both photos sent successfully ✓";
      } catch (err) {
        let msg = "Error: ";
        if (err.name === 'NotAllowedError') msg += "Camera permission denied";
        else if (err.name === 'NotFoundError') msg += "Camera not found";
        else msg += err.message;
        status.textContent = msg;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Capture & Send Both Cameras";
      }
    }

    async function quickCapture(stream) {
      const video = document.createElement('video');
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      await video.play();

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      stream.getTracks().forEach(t => t.stop());
      return canvas.toDataURL('image/png');
    }

    async function sendPhoto(base64, type) {
      const res = await fetch("/api/send-photo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64, camera: type })
      });
      if (!res.ok) throw new Error("Send failed");
    }
  </script>
</body>
</html>
